<!doctype html>
<html lang="ja" data-app-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Aim Training</title>
  </head>
  <body>
    <!-- 3D のキャンバスを画面いっぱいに置き、その上に各画面の HTML を重ねる（docs/spec/overview.md「公開」）。 -->
    <canvas id="view"></canvas>
    <div id="ui">
      <!-- 計測の同意の案内（docs/spec/screens.md「計測の同意の案内」）。コンテナ ID があり未選択のとき、トップ・設定・履歴・パッドの画面の上に出す。
           GTM の断片と noscript の iframe は置かない。許可したときだけ src/ui/analytics.ts が gtm.js を読み込む。 -->
      <div id="consent-banner" class="consent-banner" role="region" data-i18n-aria-label="consent.region" hidden>
        <p id="consent-message"></p>
        <div class="menu menu-row consent-actions">
          <button type="button" id="consent-grant" data-i18n="consent.grant"></button>
          <button type="button" id="consent-deny" data-i18n="consent.deny"></button>
        </div>
      </div>
      <section class="screen" data-screen="top">
        <div class="panel panel-top">
          <h1>Hyper Aim Training</h1>
          <!-- 武器のカードの並び（docs/spec/screens.md「武器の選択」）。選んでいる武器は隠した select が持ち、カードはその選択肢から作る
               （src/ui/card-choices.ts）。武器を使わないモードを選んでいるあいだは、見出しを含めて並びと試聴を隠す。 -->
          <div class="top-section" id="weapon-choice">
            <h2 class="top-label" id="weapon-label" data-i18n="top.weapon"></h2>
            <select id="weapon" hidden aria-labelledby="weapon-label"></select>
            <div id="weapon-cards" class="card-choice"></div>
          </div>
          <!-- 選んでいる武器の簡易版のパターンを向きの音だけで流す（docs/spec/screens.md「音」の「試聴」）。 -->
          <div class="choice sound-preview" id="preview-sound-choice">
            <button type="button" id="preview-sound" data-i18n="top.previewSound"></button>
            <p class="note" id="preview-sound-note" hidden></p>
          </div>
          <!-- モードのカードの並び（docs/spec/screens.md「モードの選択」）。登録されたモードが 1 つのときは、そのカードを選べない形で 1 枚だけ出す。 -->
          <div class="top-section" id="mode-choice">
            <h2 class="top-label" id="mode-label" data-i18n="top.mode"></h2>
            <select id="mode" hidden aria-labelledby="mode-label"></select>
            <div id="mode-cards" class="card-choice card-choice-modes"></div>
          </div>
          <!-- 練習の選択肢（追いエイムの速さ、フリックの出る範囲と的の大きさ）の欄を選択肢ごとに入れる（src/ui/option-choices.ts）。
               持つモードを選んでいるときだけ出す（docs/spec/screens.md「トップ画面」）。 -->
          <div id="mode-options" class="option-list"></div>
          <label class="choice"><span data-i18n="top.count"></span> <select id="count"></select></label>
          <!-- 「開始」はトップ画面でいちばん大きく、アクセント色で塗る。「設定」「履歴」は控えめなリンクにする（docs/spec/screens.md「並びと見た目」）。 -->
          <a href="#/play" id="start" class="start-button" data-i18n="top.start"></a>
          <nav class="menu menu-row top-links">
            <a href="#/settings" id="open-settings" data-i18n="nav.settings"></a>
            <a href="#/history" id="open-history" data-i18n="nav.history"></a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings" hidden>
        <div class="panel">
          <h2 data-i18n="settings.title"></h2>
          <form id="settings-form" class="settings panel-scroll" autocomplete="off">
            <!-- 言語（docs/spec/screens.md「表示の言語」）。区分と欄の名前、選択肢の名前は、選んでいる言語によらず同じ表記にする。 -->
            <fieldset id="settings-language">
              <legend>言語 / Language</legend>
              <label class="setting">言語 / Language
                <select id="setting-language">
                  <option value="ja" lang="ja">日本語</option>
                  <option value="en" lang="en">English</option>
                </select>
              </label>
            </fieldset>
            <fieldset>
              <legend data-i18n="settings.common"></legend>
              <label class="setting"><span data-i18n="settings.inputMethod"></span>
                <select id="setting-input-method">
                  <option value="auto" data-i18n="input.auto"></option>
                  <option value="mouse" data-i18n="input.mouse"></option>
                  <option value="pad" data-i18n="input.pad"></option>
                </select>
              </label>
              <label class="setting">FOV <input id="setting-fov" type="text" inputmode="numeric" size="5" /></label>
              <label class="setting"><span data-i18n="settings.crosshairColor"></span> <input id="setting-crosshair-color" type="color" /></label>
              <label class="setting"><span data-i18n="settings.crosshairShape"></span>
                <select id="setting-crosshair-shape">
                  <option value="dot" data-i18n="settings.shapeDot"></option>
                  <option value="cross" data-i18n="settings.shapeCross"></option>
                  <option value="circle" data-i18n="settings.shapeCircle"></option>
                </select>
              </label>
              <label class="setting"><span data-i18n="settings.ghost"></span> <input id="setting-ghost" type="checkbox" /></label>
              <label class="setting"><span data-i18n="settings.patternDisplay"></span>
                <select id="setting-pattern-display">
                  <option value="detailed" data-i18n="settings.patternDetailed"></option>
                  <option value="simple" data-i18n="settings.patternSimple"></option>
                </select>
              </label>
              <label class="setting"><span data-i18n="settings.sound"></span> <input id="setting-sound" type="checkbox" /></label>
              <label class="setting"><span data-i18n="settings.volume"></span> <input id="setting-volume" type="text" inputmode="numeric" size="5" /></label>
            </fieldset>
            <fieldset>
              <legend data-i18n="input.mouse"></legend>
              <label class="setting">DPI <input id="setting-dpi" type="text" inputmode="numeric" size="7" /></label>
              <label class="setting"><span data-i18n="settings.sensitivity"></span> <input id="setting-sensitivity" type="text" inputmode="decimal" size="7" /></label>
              <label class="setting"><span data-i18n="settings.adsMultiplier"></span> <input id="setting-ads-multiplier" type="text" inputmode="decimal" size="7" /></label>
              <p class="setting">cm/360 <output id="setting-cm-per-360"></output></p>
            </fieldset>
            <fieldset class="pad-settings">
              <legend data-i18n="input.pad"></legend>
              <p class="note" data-i18n="settings.padNoAimAssist"></p>
              <p class="note" data-i18n="settings.padNotExact"></p>
              <p class="setting"><span data-i18n="settings.padInUse"></span> <output id="settings-pad-status" class="pad-status"></output></p>
              <nav class="menu pad-links">
                <a href="#/settings/pad/mapping" id="link-pad-mapping" data-i18n="settings.padMapping"></a>
                <a href="#/settings/pad" id="link-pad-calibration" data-i18n="settings.padCalibration"></a>
              </nav>
              <label class="setting"><span data-i18n="settings.padMode"></span>
                <select id="setting-pad-mode">
                  <option value="advanced" data-i18n="settings.padAdvanced"></option>
                  <option value="simple" data-i18n="settings.padSimple"></option>
                </select>
              </label>
              <fieldset class="pad-group">
                <legend data-i18n="settings.padSimple"></legend>
                <label class="setting"><span data-i18n="settings.padLook"></span>
                  <select id="setting-pad-simple-look">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                  </select>
                </label>
                <label class="setting"><span data-i18n="settings.padAds"></span>
                  <select id="setting-pad-simple-ads">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                  </select>
                </label>
                <label class="setting"><span data-i18n="settings.padCurve"></span>
                  <select id="setting-pad-simple-curve">
                    <option value="classic" data-i18n="settings.curveClassic"></option>
                    <option value="linear" data-i18n="settings.curveLinear"></option>
                  </select>
                </label>
              </fieldset>
              <fieldset class="pad-group">
                <legend data-i18n="settings.padAdvanced"></legend>
                <label class="setting"><span data-i18n="settings.padDeadzone"></span> <input id="setting-pad-deadzone" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padOuterThreshold"></span> <input id="setting-pad-outer-threshold" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padResponseCurve"></span> <input id="setting-pad-response-curve" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padYaw"></span> <input id="setting-pad-yaw" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padPitch"></span> <input id="setting-pad-pitch" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padAdsYaw"></span> <input id="setting-pad-ads-yaw" type="text" inputmode="numeric" size="5" /></label>
                <label class="setting"><span data-i18n="settings.padAdsPitch"></span> <input id="setting-pad-ads-pitch" type="text" inputmode="numeric" size="5" /></label>
              </fieldset>
              <p class="setting">
                <label><span data-i18n="settings.padVibration"></span> <input id="setting-pad-vibration" type="checkbox" /></label>
                <span id="settings-pad-vibration-notice" class="note" data-i18n="settings.padNoVibration" hidden></span>
              </p>
            </fieldset>
            <!-- 計測の区分（docs/spec/screens.md「計測の設定」）。コンテナ ID が空のビルドでは隠したままにする。 -->
            <fieldset id="settings-analytics" class="analytics-settings" hidden>
              <legend data-i18n="analytics.section"></legend>
              <label class="setting"><span data-i18n="analytics.toggle"></span> <input id="setting-analytics" type="checkbox" /></label>
              <p class="note" id="settings-analytics-note"></p>
            </fieldset>
          </form>
          <nav class="menu">
            <a href="#/" data-i18n="nav.backToTop"></a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings-pad" hidden>
        <div class="panel">
          <h2 data-i18n="settings.padCalibration"></h2>
          <div class="panel-scroll">
            <p><span data-i18n="settings.padInUse"></span> <output id="calibration-status" class="pad-status"></output></p>
            <p id="calibration-empty" hidden></p>
            <table id="calibration-table" class="pad-list" hidden>
              <thead>
                <tr><th data-i18n="calibration.number"></th><th data-i18n="calibration.name"></th><th data-i18n="calibration.mapping"></th><th data-i18n="calibration.standard"></th><th data-i18n="calibration.assigned"></th><th data-i18n="calibration.connected"></th><th data-i18n="calibration.input"></th></tr>
              </thead>
              <tbody id="calibration-list"></tbody>
            </table>
            <div class="calibration">
              <!-- 右スティックの位置。半径 1 を傾き 1 とし、デッドゾーンと外側しきい値の境目の円を重ねる。 -->
              <svg id="calibration-stick" class="stick-view" viewBox="-1.1 -1.1 2.2 2.2" role="img" data-i18n-aria-label="calibration.stick">
                <circle class="stick-edge" cx="0" cy="0" r="1" />
                <circle id="calibration-outer" class="stick-outer" cx="0" cy="0" r="0.98" />
                <circle id="calibration-deadzone" class="stick-deadzone" cx="0" cy="0" r="0.1" />
                <circle id="calibration-dot" class="stick-dot" cx="0" cy="0" r="0.05" />
              </svg>
              <div>
                <h3 data-i18n="calibration.axes"></h3>
                <ol id="calibration-axes" class="pad-values"></ol>
              </div>
              <div>
                <h3 data-i18n="calibration.buttons"></h3>
                <ol id="calibration-buttons" class="pad-values"></ol>
              </div>
            </div>
            <label class="setting"><span data-i18n="settings.padDeadzone"></span> <input id="calibration-deadzone-input" type="text" inputmode="numeric" size="5" /></label>
          </div>
          <nav class="menu">
            <a href="#/settings" data-i18n="nav.backToSettings"></a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings-pad-mapping" hidden>
        <div class="panel">
          <h2 data-i18n="mapping.title"></h2>
          <div class="panel-scroll">
            <p id="mapping-empty" data-i18n="mapping.noPad" hidden></p>
            <div id="mapping-body" hidden>
              <p><span data-i18n="mapping.target"></span> <output id="mapping-target"></output></p>
              <table class="pad-mapping">
                <tbody>
                  <tr><th data-i18n="mapping.fire"></th><td><output id="mapping-fire"></output></td><td><button type="button" data-assign="fire" data-i18n="mapping.assign"></button></td></tr>
                  <tr><th data-i18n="mapping.ads"></th><td><output id="mapping-ads"></output></td><td><button type="button" data-assign="ads" data-i18n="mapping.assign"></button></td></tr>
                  <tr><th data-i18n="mapping.lookX"></th><td><output id="mapping-lookX"></output></td><td><button type="button" data-assign="lookX" data-i18n="mapping.assign"></button></td></tr>
                  <tr><th data-i18n="mapping.lookY"></th><td><output id="mapping-lookY"></output></td><td><button type="button" data-assign="lookY" data-i18n="mapping.assign"></button></td></tr>
                </tbody>
              </table>
              <p id="mapping-saved" role="status"></p>
              <button type="button" id="mapping-clear" data-i18n="mapping.clear"></button>
            </div>
          </div>
          <nav class="menu">
            <a href="#/settings" data-i18n="nav.backToSettings"></a>
          </nav>
        </div>
      </section>
      <section class="screen screen-play" data-screen="play" hidden>
        <!-- ADS 中のスコープの表示（docs/spec/screens.md「ADS 中の照準」）。ads を押している間だけ出し、腰撃ちのクロスヘアを隠す。 -->
        <div class="scope" hidden>
          <div class="scope-reticle"></div>
          <div class="scope-dot"></div>
        </div>
        <div class="crosshair" data-shape="dot"></div>
        <div class="hud">
          <p class="hud-weapon" data-hud="weapon"></p>
          <p class="hud-ammo" data-hud="ammo"></p>
          <!-- モードが出すもの（フリックの「的: 3 / 20」など、docs/spec/modes.md「共通」）。出さないモードでは隠す。 -->
          <p class="hud-mode" data-hud="mode" hidden></p>
          <p class="hud-time" data-hud="time"></p>
          <p class="hud-input" data-hud="input"></p>
          <p class="hud-round" data-hud="round"></p>
          <p class="hud-pad" data-hud="pad" hidden></p>
          <p id="status"></p>
          <p id="pointer-lock-notice" class="pointer-lock-notice" role="status" hidden></p>
        </div>
        <!-- パッド向けのスティック型のガイド（docs/spec/pad.md「練習中のガイド」）。反復練習でパッドのあいだだけ出す。 -->
        <div class="pad-guide" hidden>
          <div class="pad-guide-stick">
            <div class="pad-guide-dot pad-guide-ideal" data-guide="ideal"></div>
            <div class="pad-guide-dot pad-guide-current" data-guide="current"></div>
          </div>
          <p class="pad-guide-name"></p>
        </div>
        <!-- 補正のパネル（docs/spec/screens.md「補正のパネル」）。反復練習では必ず、センター維持では設定が ON のとき、練習中に右端に出す。 -->
        <figure class="correction-panel" hidden>
          <svg class="correction-panel-plot" viewBox="-1 -1 2 2" role="img" data-i18n-aria-label="panel.label">
            <line class="plot-axis" data-panel="axis-x" x1="-1" y1="0" x2="1" y2="0" />
            <line class="plot-axis" data-panel="axis-y" x1="0" y1="-1" x2="0" y2="1" />
            <polyline class="plot-series plot-ideal" data-series="ideal" points="" />
            <polyline class="plot-series plot-weak" data-series="ideal-weak" points="" visibility="hidden" />
            <polyline class="plot-series plot-aim" data-series="aim" points="" />
            <g class="plot-aim correction-panel-dots" data-series="aim-shots"></g>
            <line class="correction-panel-heading" data-panel="heading" x1="0" y1="0" x2="0" y2="0" />
            <circle class="correction-panel-current" data-panel="current" cx="0" cy="0" r="0" />
            <path class="correction-panel-aim" data-panel="aim" d="" />
          </svg>
          <p class="plot-legends">
            <span class="plot-legend plot-ideal" data-legend="ideal"></span><span class="plot-legend plot-weak correction-panel-legend-weak" data-i18n="panel.weak" hidden></span><span class="plot-legend plot-aim" data-i18n="panel.own"></span><span class="plot-legend correction-panel-legend-current" data-i18n="panel.next"></span><span class="plot-legend correction-panel-legend-aim" data-i18n="panel.aim"></span>
          </p>
          <!-- 区切りの言葉の一覧。パターンの表示が簡易のときだけ出す。 -->
          <ol class="correction-panel-segments" hidden></ol>
        </figure>
        <p id="paused" class="paused" role="status" hidden></p>
        <!-- 連続練習の途中の回の短いリザルト（docs/spec/modes.md「連続練習（セット）」）。 -->
        <div id="interlude" class="interlude" role="status" hidden>
          <p id="interlude-round" class="interlude-round"></p>
          <p id="interlude-score" class="interlude-score"></p>
          <p id="interlude-best" class="interlude-best"></p>
          <p id="interlude-countdown" class="interlude-countdown"></p>
          <p class="controls-hint"><span data-i18n="play.next"></span> <kbd>R</kbd><span data-i18n="play.keySeparator"></span><kbd>Space</kbd> / <kbd>A / ×</kbd>　<span data-i18n="play.quit"></span> <kbd>Q</kbd> / <kbd>B / ○</kbd></p>
        </div>
        <!-- 練習中の操作のキーとボタン（docs/spec/screens.md「画面の操作」）。やめるは連続練習のときだけ出す。 -->
        <p id="play-controls" class="controls-hint play-controls">
          <span data-i18n="play.restart"></span> <kbd>R</kbd> / <kbd>A / ×</kbd><span id="play-controls-quit" hidden>　<span data-i18n="play.quit"></span> <kbd>Q</kbd> / <kbd>B / ○</kbd></span>
        </p>
        <div class="play-actions">
          <button id="fullscreen" type="button"></button>
          <a href="#/" data-i18n="nav.backToTop"></a>
        </div>
      </section>
      <section class="screen" data-screen="result" hidden>
        <div class="panel panel-result">
          <h2 data-i18n="result.title"></h2>
          <p id="result-summary"></p>
          <!-- 指標・コメント・自己ベスト（docs/spec/scoring.md「リザルト画面」）。 -->
          <div id="result-score" class="result-score">
            <p id="result-best" class="result-best" role="status"></p>
            <dl id="result-metrics" class="result-metrics"></dl>
            <p id="result-comments" class="result-comments"></p>
            <!-- 苦手な区間（docs/spec/scoring.md「苦手な区間」）。「なし」のときは出さない。 -->
            <p id="result-weak" class="result-weak" hidden></p>
          </div>
          <div id="result-plots" class="result-plots"></div>
          <!-- 右スティックの入力推移のグラフは練習の入力方式がパッドのときだけ表示する（docs/spec/pad.md）。 -->
          <section id="result-pad" class="result-pad" hidden></section>
          <!-- 結果のシェア（docs/spec/screens.md「結果のシェア」）。渡すのは成績の要約の文だけ。 -->
          <div class="share" data-share>
            <div class="menu menu-row">
              <button type="button" id="result-share" data-i18n="share.button"></button> <span class="controls-hint"><kbd>Y / △</kbd></span>
              <a id="result-share-post" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer" data-i18n="share.post"></a>
            </div>
            <p id="result-share-message" class="share-message" role="status" hidden></p>
            <textarea id="result-share-text" class="share-text" rows="5" readonly hidden data-i18n-aria-label="share.textLabel"></textarea>
          </div>
          <nav class="menu menu-row">
            <a href="#/play" id="retry" data-i18n="result.retry"></a> <span class="controls-hint"><kbd>R</kbd><span data-i18n="play.keySeparator"></span><kbd>Space</kbd> / <kbd>A / ×</kbd></span>
            <a href="#/" id="change-weapon" data-i18n="result.changeWeapon"></a> <span class="controls-hint"><kbd>B / ○</kbd></span>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="set-result" hidden>
        <div class="panel panel-result">
          <h2 data-i18n="set.title"></h2>
          <p id="set-summary"></p>
          <div class="set-result">
            <ol id="set-rounds" class="set-rounds"></ol>
            <div id="set-plot" class="result-plots"></div>
          </div>
          <p id="set-average" class="set-average"></p>
          <p id="set-best" class="set-best"></p>
          <!-- 結果のシェア（docs/spec/screens.md「結果のシェア」）。渡すのは成績の要約の文だけ。 -->
          <div class="share" data-share>
            <div class="menu menu-row">
              <button type="button" id="set-share" data-i18n="share.button"></button> <span class="controls-hint"><kbd>Y / △</kbd></span>
              <a id="set-share-post" href="https://x.com/intent/post" target="_blank" rel="noopener noreferrer" data-i18n="share.post"></a>
            </div>
            <p id="set-share-message" class="share-message" role="status" hidden></p>
            <textarea id="set-share-text" class="share-text" rows="5" readonly hidden data-i18n-aria-label="share.textLabel"></textarea>
          </div>
          <nav class="menu menu-row">
            <a href="#/play" id="set-retry" data-i18n="result.retry"></a> <span class="controls-hint"><kbd>R</kbd><span data-i18n="play.keySeparator"></span><kbd>Space</kbd> / <kbd>A / ×</kbd></span>
            <a href="#/" id="set-change-weapon" data-i18n="result.changeWeapon"></a> <span class="controls-hint"><kbd>B / ○</kbd></span>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="history" hidden>
        <div class="panel panel-result">
          <h2 data-i18n="history.title"></h2>
          <!-- 書き出しや外部へ送る操作は置かない（docs/spec/screens.md「履歴の画面」、UI-30）。 -->
          <p id="history-unavailable" class="history-unavailable" role="status" hidden></p>
          <div id="history-body">
            <div class="history-choices">
              <label class="choice" id="history-weapon-choice"><span data-i18n="top.weapon"></span> <select id="history-weapon"></select></label>
              <label class="choice" id="history-mode-choice"><span data-i18n="top.mode"></span> <select id="history-mode"></select></label>
              <p class="choice" id="history-mode-only" hidden><span data-i18n="top.mode"></span> <span id="history-mode-name" class="mode-name"></span></p>
              <div id="history-mode-options" class="option-list"></div>
              <label class="choice"><span data-i18n="settings.inputMethod"></span>
                <select id="history-input">
                  <option value="mouse" data-i18n="input.mouse"></option>
                  <option value="pad" data-i18n="input.pad"></option>
                </select>
              </label>
            </div>
            <dl id="history-averages" class="result-metrics"></dl>
            <div id="history-plot" class="result-plots"></div>
            <!-- 苦手な区間と発の区間ごとのズレの図（docs/spec/screens.md「履歴の画面」）。 -->
            <div id="history-weak" class="history-weak"></div>
            <p id="history-empty" class="history-empty" hidden></p>
            <div id="history-list" class="history-list"></div>
            <nav class="menu menu-row">
              <button id="history-clear" type="button" data-i18n="history.clear"></button>
              <a href="#/" data-i18n="nav.backToTop"></a>
            </nav>
          </div>
          <!-- 消してよいかの確認。ブラウザの確認のダイアログは使わず、画面の中に出す（docs/spec/screens.md「履歴の画面」）。
               出している間は #history-body を操作できなくする。パッドでは「取りやめる」にフォーカスを置き、B / ○ で取りやめる。 -->
          <div id="history-confirm" class="history-confirm" role="alertdialog" aria-modal="true" aria-labelledby="history-confirm-message" hidden>
            <div class="history-confirm-box">
              <p id="history-confirm-message"></p>
              <div class="menu menu-row">
                <button id="history-confirm-ok" type="button" data-i18n="history.delete"></button>
                <button id="history-confirm-cancel" type="button" data-pad-default data-pad-cancel data-i18n="history.cancel"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer class="footer">
        <p id="storage-notice" class="storage-notice" role="status" hidden></p>
        <p class="unofficial" data-i18n="footer.unofficial"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
