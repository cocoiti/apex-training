<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>リコイル練習（非公式）</title>
  </head>
  <body>
    <!-- 3D のキャンバスを画面いっぱいに置き、その上に各画面の HTML を重ねる（docs/spec/overview.md「公開」）。 -->
    <canvas id="view"></canvas>
    <div id="ui">
      <section class="screen" data-screen="top">
        <div class="panel">
          <h1>リコイル練習</h1>
          <label class="weapon-choice">武器 <select id="weapon"></select></label>
          <nav class="menu">
            <a href="#/play">開始</a>
            <a href="#/settings">設定</a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings" hidden>
        <div class="panel">
          <h2>設定</h2>
          <nav class="menu">
            <a href="#/settings/pad">パッドのキャリブレーション</a>
            <a href="#/">トップへ戻る</a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings-pad" hidden>
        <div class="panel">
          <h2>パッドのキャリブレーション</h2>
          <nav class="menu">
            <a href="#/settings">設定へ戻る</a>
          </nav>
        </div>
      </section>
      <section class="screen screen-play" data-screen="play" hidden>
        <div class="crosshair" data-shape="dot"></div>
        <p id="status">読み込み中</p>
        <a class="play-exit" href="#/">トップへ戻る</a>
      </section>
      <section class="screen" data-screen="result" hidden>
        <div class="panel">
          <h2>リザルト</h2>
          <nav class="menu">
            <a href="#/">トップへ戻る</a>
          </nav>
        </div>
      </section>
      <footer class="footer">
        <p id="storage-notice" class="storage-notice" role="status" hidden></p>
        <p class="unofficial">非公式ファンツールであり、EA / Respawn とは無関係です。</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
