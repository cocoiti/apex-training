<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>リコイル練習（非公式）</title>
  </head>
  <body>
    <!-- 3D のキャンバスを画面いっぱいに置き、その上に各画面の HTML を重ねる（docs/spec/overview.md「公開」）。 -->
    <canvas id="view"></canvas>
    <div id="ui">
      <section class="screen" data-screen="top">
        <div class="panel">
          <h1>リコイル練習</h1>
          <label class="choice">武器 <select id="weapon"></select></label>
          <label class="choice">モード <select id="mode"></select></label>
          <nav class="menu">
            <a href="#/play" id="start">開始</a>
            <a href="#/settings">設定</a>
            <a href="#/history" id="open-history">履歴</a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings" hidden>
        <div class="panel">
          <h2>設定</h2>
          <form id="settings-form" class="settings" autocomplete="off">
            <fieldset>
              <legend>共通</legend>
              <label class="setting">入力方式
                <select id="setting-input-method">
                  <option value="auto">自動</option>
                  <option value="mouse">マウス</option>
                  <option value="pad">パッド</option>
                </select>
              </label>
              <label class="setting">FOV <input id="setting-fov" type="text" inputmode="numeric" size="5" /></label>
              <label class="setting">クロスヘアの色 <input id="setting-crosshair-color" type="color" /></label>
              <label class="setting">クロスヘアの形
                <select id="setting-crosshair-shape">
                  <option value="dot">点</option>
                  <option value="cross">十字</option>
                  <option value="circle">輪</option>
                </select>
              </label>
              <label class="setting">ゴースト表示 <input id="setting-ghost" type="checkbox" /></label>
              <label class="setting">音 <input id="setting-sound" type="checkbox" /></label>
            </fieldset>
            <fieldset>
              <legend>マウス</legend>
              <label class="setting">DPI <input id="setting-dpi" type="text" inputmode="numeric" size="7" /></label>
              <label class="setting">感度 <input id="setting-sensitivity" type="text" inputmode="decimal" size="7" /></label>
              <label class="setting">ADS 倍率 <input id="setting-ads-multiplier" type="text" inputmode="decimal" size="7" /></label>
              <p class="setting">cm/360 <output id="setting-cm-per-360"></output></p>
            </fieldset>
            <fieldset>
              <legend>パッド</legend>
              <a href="#/settings/pad">パッドのキャリブレーション</a>
            </fieldset>
          </form>
          <nav class="menu">
            <a href="#/">トップへ戻る</a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="settings-pad" hidden>
        <div class="panel">
          <h2>パッドのキャリブレーション</h2>
          <nav class="menu">
            <a href="#/settings">設定へ戻る</a>
          </nav>
        </div>
      </section>
      <section class="screen screen-play" data-screen="play" hidden>
        <!-- ADS 中のスコープの表示（docs/spec/screens.md「ADS 中の照準」）。ads を押している間だけ出し、腰撃ちのクロスヘアを隠す。 -->
        <div class="scope" hidden>
          <div class="scope-reticle"></div>
          <div class="scope-dot"></div>
        </div>
        <div class="crosshair" data-shape="dot"></div>
        <div class="hud">
          <p class="hud-weapon" data-hud="weapon"></p>
          <p class="hud-ammo" data-hud="ammo"></p>
          <p class="hud-time" data-hud="time"></p>
          <p class="hud-input" data-hud="input"></p>
          <p id="status">読み込み中</p>
          <p id="pointer-lock-notice" class="pointer-lock-notice" role="status" hidden></p>
        </div>
        <p id="paused" class="paused" role="status" hidden></p>
        <div class="play-actions">
          <button id="fullscreen" type="button">全画面</button>
          <a href="#/">トップへ戻る</a>
        </div>
      </section>
      <section class="screen" data-screen="result" hidden>
        <div class="panel panel-result">
          <h2>リザルト</h2>
          <p id="result-summary"></p>
          <!-- 指標・コメント・自己ベストは採点するモードだけ表示する（docs/spec/scoring.md「リザルト画面」）。 -->
          <div id="result-score" class="result-score">
            <p id="result-best" class="result-best" role="status"></p>
            <dl id="result-metrics" class="result-metrics"></dl>
            <p id="result-comments" class="result-comments"></p>
          </div>
          <div id="result-plots" class="result-plots"></div>
          <nav class="menu menu-row">
            <a href="#/play" id="retry">もう一度</a>
            <a href="#/" id="change-weapon">武器変更</a>
          </nav>
        </div>
      </section>
      <section class="screen" data-screen="history" hidden>
        <div class="panel panel-result">
          <h2>履歴</h2>
          <!-- 書き出しや外部へ送る操作は置かない（docs/spec/screens.md「履歴の画面」、UI-22）。 -->
          <p id="history-unavailable" class="history-unavailable" role="status" hidden></p>
          <div class="history-choices">
            <label class="choice">武器 <select id="history-weapon"></select></label>
            <label class="choice">モード <select id="history-mode"></select></label>
            <label class="choice">入力方式
              <select id="history-input">
                <option value="mouse">マウス</option>
                <option value="pad">パッド</option>
              </select>
            </label>
          </div>
          <dl id="history-averages" class="result-metrics"></dl>
          <div id="history-plot" class="result-plots"></div>
          <p id="history-empty" class="history-empty" hidden></p>
          <div id="history-list" class="history-list"></div>
          <nav class="menu menu-row">
            <button id="history-clear" type="button">この履歴を消す</button>
            <a href="#/">トップへ戻る</a>
          </nav>
        </div>
      </section>
      <footer class="footer">
        <p id="storage-notice" class="storage-notice" role="status" hidden></p>
        <p class="unofficial">非公式ファンツールであり、EA / Respawn とは無関係です。</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
